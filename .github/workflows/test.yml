name: Test

on:
  push:
    paths-ignore:
      - '**.md'
  schedule:
    # Weekly, at 00:30 UTC on Friday (somewhat randomly chosen).
    - cron: '30 00 * * 5'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.0

  test:
    strategy:
      # It's much easier to re-run as few jobs as possible:
      fail-fast: false
      matrix:
        platform:
          - x86
          - x64
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest
          - windows-2022
          - windows-2025
          - windows-latest
        include:
          - {platform: x86, expected_prefix: i686-w64-mingw32}
          - {platform: x64, expected_prefix: x86_64-w64-mingw32}
    runs-on: ${{ matrix.os }}
    name: |
      Test: ${{ matrix.os }} / ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clean up PATH
        uses: egor-tensin/cleanup-path@v5
        if: runner.os == 'Windows'
      - name: Set up MinGW
        id: setup
        uses: $/
        with:
          platform: ${{ matrix.platform }}
          cc: 1
      - name: Check prefix
        env:
          PREFIX: ${{ steps.setup.outputs.prefix }}
        run: |
          $env:PREFIX -eq '${{ matrix.expected_prefix }}' -or $(throw "Unexpected prefix: $env:PREFIX")
      - name: Build threads.exe
        env:
          GXX: ${{ steps.setup.outputs.gxx }}
        run: |
          & $env:GXX -std=c++14 -o (Join-Path . test threads) (Join-Path . test threads.cpp)
      - name: Run threads.exe
        uses: $/.github/actions/run-threads
        if: runner.os == 'Windows'
      - name: Check cc/c++
        uses: $/.github/actions/check-cc

  test_windows_versions:
    strategy:
      matrix:
        version:
          - 8.1.0
          - 12.2.0
          - 15.2.0
    runs-on: windows-latest
    name: |
      Version: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clean up PATH
        uses: egor-tensin/cleanup-path@v5
      - name: Set up MinGW
        id: setup
        uses: $/
        with:
          version: ${{ matrix.version }}
      - name: Verify version
        uses: $/.github/actions/check-cc
        with:
          version: ${{ matrix.version }}
      - name: Check prefix
        env:
          PREFIX: ${{ steps.setup.outputs.prefix }}
        run: |
          $env:PREFIX -eq 'x86_64-w64-mingw32' -or $(throw "Unexpected prefix: $env:PREFIX")
      - name: Build threads.exe
        env:
          GXX: ${{ steps.setup.outputs.gxx }}
        run: |
          & $env:GXX -std=c++14 -o (Join-Path . test threads) (Join-Path . test threads.cpp)
      - name: Run threads.exe
        uses: $/.github/actions/run-threads

  release:
    if: github.ref_type == 'tag'
    name: Release
    runs-on: ubuntu-latest
    needs:
      - test
      - test_windows_versions
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release
        uses: softprops/action-gh-release@v3
