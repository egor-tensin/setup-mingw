name: Check cc/c++
description: Check cc/c++
inputs:
  version:
    description: GCC version to grep for
    required: false
runs:
  using: composite
  steps:
    - env:
        ARG_VERSION: ${{ inputs.version }}
      run: |
        function Check-Exe {
            param(
                [Parameter(Mandatory=$true)]
                [string] $Exe
            )

            echo (Get-Command $Exe).Path
            $output = & $Exe --version
            echo $output

            # Is this really the most stable piece of `gcc --version` output?
            $pattern = "This is free software; see the source for copying conditions."
            $($output | Select-String -Pattern $pattern -SimpleMatch -Quiet) -or $(throw "Unexpected `$Exe --version` output")

            $version = $env:ARG_VERSION
            if ($version) {
                $($output | Select-String -Pattern $version -SimpleMatch -Quiet) -or $(throw "Unexpected `$Exe --version` output")
            }
        }

        Check-Exe cc
        Check-Exe c++
      shell: pwsh
